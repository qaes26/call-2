# ===================================================================
# تكوين Nginx Reverse Proxy المشفر مع دعم WSS والأمان العالي
# ملف: /etc/nginx/sites-available/parents-call
# ===================================================================

# تحديد معدل الطلبات لحظر هجمات الحرمان من الخدمة (DDoS & Brute Force)
limit_req_zone $binary_remote_addr zone=signaling_limit:10m rate=15r/s;

# تحويل كافة اتصالات HTTP العادية إلى HTTPS المشفر تلقائياً
server {
    listen 80;
    listen [::]:80;
    server_name family.yourdomain.com;
    return 301 https://$host$request_uri;
}

# خادم HTTPS الرئيسي
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name family.yourdomain.com;

    # شهادات الأمان الحديثة (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/family.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family.yourdomain.com/privkey.pem;

    # بروتوكولات وتشفيرات TLS الموصى بها سيبرانياً (Mozilla Modern Config)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ترويسات الحماية المشددة (Security Headers)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # سياسة أمان المحتوى (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.socket.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss: ws: https:; media-src 'self' blob:; img-src 'self' data: blob:;" always;

    # تمرير حركة المرور إلى خادم Node.js الداخلي
    location / {
        limit_req zone=signaling_limit burst=25 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ترقية الاتصال الإلزامية لدعم بروتوكول Secure WebSockets (WSS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # تمرير الترويسات الحقيقية للعميل
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # مهلة الاتصال الطويلة لمنع انقطاع إشارات Socket.io
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
