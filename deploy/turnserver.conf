# ===================================================================
# تكوين خادم Coturn المشفر لبيئة الإنتاج (Production Turn Server)
# ملف: /etc/turnserver.conf
# ===================================================================

# المنافذ المستمعة
listening-port=3478
tls-listening-port=5349

# العناوين المحلية والخارجية (استبدل YOUR_SERVER_PUBLIC_IP بعنوان السيرفر العام)
# listening-ip=0.0.0.0
# external-ip=YOUR_SERVER_PUBLIC_IP

# نطاق ومجال الخادم
realm=turn.yourdomain.com
server-name=parents-call-coturn

# تفعيل آلية المصادقة المؤقتة السرية (Ephemeral Credentials - REST API RFC 5766)
# يجب أن يتطابق هذا المفتاح مع TURN_SHARED_SECRET في ملف .env
use-auth-secret
static-auth-secret=coturn_secure_family_secret_key_89234892374

# البصمة الإلزامية في ترويسات STUN
fingerprint
lt-cred-mech

# حصر منافذ الترحيل UDP (Relay Ports)
min-port=49152
max-port=65535

# شهادات التشفير TLS (Let's Encrypt)
cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

# تشفيرات TLS الحديثة والآمنة فقط (حظر الخوارزميات القديمة)
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# حظر واجهة التحكم CLI لتقليل سطح الهجوم
no-cli

# تسجيل الأحداث
log-file=/var/log/turnserver.log
verbose
