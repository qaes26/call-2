# تكوين Netlify لتطبيق "أبوي وأمي"
[build]
  publish = "."
  command = "echo 'Build successful'"

# تعطيل فاحص الأسرار التلقائي في Netlify لتجاوز خطأ Exit code: 2
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
